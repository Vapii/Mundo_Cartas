{% extends 'base.html' %}

{% block title %}Editar Producto{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <h2 class="text-center mb-4">Editar Producto</h2>

    <form method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm">
        {% csrf_token %}

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" name="nombre" id="nombre" class="form-control" value="{{ producto.nombre }}">
        </div>

        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea name="descripcion" id="descripcion" class="form-control">{{ producto.descripcion }}</textarea>
        </div>

        <div class="mb-3">
            <label for="precio" class="form-label">Precio</label>
            <input type="number" name="precio" id="precio" class="form-control" value="{{ producto.precio }}">
        </div>

        <div class="mb-3">
            <label for="stock" class="form-label">Stock</label>
            <input type="number" name="stock" id="stock" class="form-control" value="{{ producto.stock }}">
        </div>

        <div class="mb-3">
            <label for="imagen" class="form-label">Imagen</label>
            <input type="file" name="imagen" id="imagen" class="form-control">
            {% if producto.imagen %}
                <div class="mt-2">
                    <img src="{{ producto.imagen.url }}" alt="Imagen actual" style="max-height: 150px;">
                </div>
            {% endif %}
        </div>

        <div class="mb-3">
            <label class="form-label">Categorías</label>
            {% for categoria in categorias %}
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="categorias" value="{{ categoria.id }}"
                        {% if categoria in producto.categorias.all %}checked{% endif %}>
                    <label class="form-check-label">{{ categoria.nombre }}</label>
                </div>
            {% endfor %}
        </div>

        <div class="d-flex justify-content-between mt-4">
            <button type="submit" class="btn btn-warning">Guardar cambios</button>
            <a href="{% url 'admin_productos' %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
