{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Editar Producto</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Nombre</label>
        <input type="text" name="nombre" value="{{ producto.nombre }}" required>

        <label>Descripción</label>
        <textarea name="descripcion" required>{{ producto.descripcion }}</textarea>

        <label>Precio</label>
        <input type="number" name="precio" value="{{ producto.precio }}" required>

        <label>Stock</label>
        <input type="number" name="stock" value="{{ producto.stock }}" required>

        <label>Categorías</label>
        <select name="categorias" multiple size="5">
            {% for categoria in categorias %}
                <option value="{{ categoria.id }}"
                    {% if categoria in producto.categorias.all %}selected{% endif %}>
                    {{ categoria.nombre }}
                </option>
            {% endfor %}
        </select>

        <label>Imagen actual</label><br>
        {% if producto.imagen %}
            <img src="{{ producto.imagen.url }}" width="130" alt="">
        {% else %}
            <p>No tiene imagen.</p>
        {% endif %}

        <br><br>

        <label>Nueva imagen (opcional)</label>
        <input type="file" name="imagen">

        <br><br>
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
        <a href="{% url 'admin_productos' %}" class="btn btn-secondary">Cancelar</a>
    </form>

</div>
{% endblock %}
