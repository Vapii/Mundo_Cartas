{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container">
    <h2>Editar Producto</h2>

    <form method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm">
        {% csrf_token %}

        <!-- Nombre -->
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" name="nombre" id="nombre" class="form-control" value="{{ producto.nombre }}" required>
        </div>

        <!-- Descripción -->
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea name="descripcion" id="descripcion" class="form-control" required>{{ producto.descripcion }}</textarea>
        </div>

        <!-- Precio -->
        <div class="mb-3">
            <label for="precio" class="form-label">Precio</label>
            <input type="number" name="precio" id="precio" class="form-control" value="{{ producto.precio }}" min="0" required>
        </div>

        <!-- Stock -->
        <div class="mb-3">
            <label for="stock" class="form-label">Stock</label>
            <input type="number" name="stock" id="stock" class="form-control" value="{{ producto.stock }}" min="0" required>
        </div>

        <!-- Categorías -->
        <div class="mb-3">
            <label for="categorias" class="form-label">Categorías</label>
            <select name="categorias" id="categorias" class="form-select" multiple size="5">
                {% for categoria in categorias %}
                    <option value="{{ categoria.id }}"
                        {% if categoria in producto.categorias.all %}selected{% endif %}>
                        {{ categoria.nombre }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <!-- Agregar nuevos códigos -->
        <div class="mb-3">
            <label for="nuevos_codigos" class="form-label">Agregar nuevos códigos</label>
            <textarea name="nuevos_codigos" id="nuevos_codigos" class="form-control" rows="3"
                    placeholder="Ingresa nuevos códigos separados por coma o salto de línea"></textarea>
            <small class="text-muted">Los códigos duplicados no se guardarán.</small>
        </div>

        <!-- Escaneo de código -->
        <div class="mb-3">
            <button type="button" id="btn-escanear" class="btn btn-secondary">
                <i class="fas fa-barcode"></i> Escanear código
            </button>
            <div id="scanner" style="width:100%; height:300px; display:none; background:#000; margin-top:15px;"></div>
        </div>


        <!-- Imagen actual -->
        <div class="mb-3">
            <label class="form-label">Imagen actual</label><br>
            {% if producto.imagen %}
                <img src="{{ producto.imagen.url }}" width="130" alt="Imagen actual">
            {% else %}
                <p class="text-muted">No tiene imagen.</p>
            {% endif %}
        </div>

        <!-- Nueva imagen -->
        <div class="mb-3">
            <label for="imagen" class="form-label">Nueva imagen (opcional)</label>
            <input type="file" name="imagen" id="imagen" class="form-control">
        </div>

        <!-- Botones -->
        <div class="d-flex justify-content-between mt-4">
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
            <a href="{% url 'admin_productos' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts_extra %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script src="{% static 'js/escaner.js' %}"></script>
{% endblock %}
