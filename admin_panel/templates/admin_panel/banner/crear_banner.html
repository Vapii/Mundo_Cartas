{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Crear Banner</h2>
  <form method="POST" enctype="multipart/form-data" class="card p-4">
    {% csrf_token %}
    <div class="mb-3">
      <label for="titulo" class="form-label">Título (opcional)</label>
      <input type="text" name="titulo" id="titulo" class="form-control">
    </div>
    <div class="mb-3">
      <label for="imagen" class="form-label">Imagen</label>
      <input type="file" name="imagen" id="imagen" class="form-control" required>
    </div>
        <div class="mb-3 d-flex align-items-center">
        <label for="activo" class="form-label me-2 mb-0">Activo</label>
        <input type="checkbox" name="activo" id="activo" class="form-check-input">
        </div>
    <button type="submit" class="btn btn-primary">Guardar banner</button>
  </form>
</div>
{% endblock %}
