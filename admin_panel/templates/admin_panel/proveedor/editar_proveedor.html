{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
  <h2>Editar Proveedor</h2>

  {% if messages %}
    <div class="mb-3">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <form method="POST" class="card p-4">
    {% csrf_token %}
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" name="nombre" id="nombre" class="form-control" value="{{ proveedor.nombre }}" required>
    </div>
    <div class="mb-3">
      <label for="contacto" class="form-label">Contacto</label>
      <input type="text" name="contacto" id="contacto" class="form-control" value="{{ proveedor.contacto }}">
    </div>
    <div class="form-check mb-3">
      <input type="checkbox" name="activo" id="activo" class="form-check-input" {% if proveedor.activo %}checked{% endif %}>
      <label for="activo" class="form-check-label">Activo</label>
    </div>
    <button type="submit" class="btn btn-primary">Actualizar</button>
    <a href="{% url 'admin_proveedores' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
